document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ground: rgba(0,0,0,0.16); border-radius: 6px; border: 2px solid transparent; background-clip: padding-box; }\n  ::-webkit-scrollbar-track { background: transparent; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div ref=\"{{ rootRef }}\" style=\"--ink:#1f2228; --ink2:#6b7177; --ink3:#9aa0a6; --line:rgba(20,22,28,0.09); --line2:rgba(20,22,28,0.14); --panel:rgba(252,252,251,0.94); --field:#ffffff; --btn:#f1f1ee; --btn-h:#e8e8e3; --accent:#2e63c8; --accent-ink:#1c4ba0; --tint:#eaf1fc; --tint-line:#bcd2f4; --tile:#efeee9; --tile2:#e6e5df; --ok:#2e9e6b; font-family:'Public Sans',-apple-system,system-ui,sans-serif; background:#e9e8e3; color:var(--ink); min-height:100vh; -webkit-font-smoothing:antialiased;\">\n\n  <!-- ===================== COVER ===================== -->\n  <div style=\"max-width:1180px; margin:0 auto; padding:72px 32px 40px;\">\n    <div style=\"display:flex; align-items:center; gap:10px; font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.04em; color:var(--ink2); margin-bottom:28px;\">\n      <span style=\"width:7px; height:7px; border-radius:50%; background:var(--accent);\"><\u002Fspan>\n      CXR · sketch2unity\n      <span style=\"color:var(--ink3);\">/<\u002Fspan>\n      <span style=\"color:var(--ink3);\">Interface redesign — visual target<\u002Fspan>\n    <\u002Fdiv>\n    <h1 style=\"font-size:54px; line-height:1.04; letter-spacing:-0.025em; font-weight:800; margin:0 0 20px; max-width:880px;\">A calmer, clearer interface for turning sketches into walkable places.<\u002Fh1>\n    <p style=\"font-size:18px; line-height:1.55; color:var(--ink2); max-width:680px; margin:0 0 36px; font-weight:400;\">Redesigning the CXR Visualization Tool — the sketch-to-3D pipeline used by Cornell Tech IRL &amp; YMPJ so South Bronx residents can draw a vacant lot and walk through it in VR. Light, restrained panels that float over the scene; fewer buttons, less text, and a real preview of everything you place.<\u002Fp>\n\n    <div style=\"display:flex; flex-wrap:wrap; gap:10px; margin-bottom:48px;\">\n      <span style=\"font-size:12.5px; font-weight:500; color:var(--ink2); background:#fff; border:1px solid var(--line); padding:7px 13px; border-radius:100px;\">Light · frosted-paper panels<\u002Fspan>\n      <span style=\"font-size:12.5px; font-weight:500; color:var(--ink2); background:#fff; border:1px solid var(--line); padding:7px 13px; border-radius:100px;\">Both residents &amp; facilitators<\u002Fspan>\n      <span style=\"font-size:12.5px; font-weight:500; color:var(--ink2); background:#fff; border:1px solid var(--line); padding:7px 13px; border-radius:100px;\">Thumbnails for every asset<\u002Fspan>\n      <span style=\"font-size:12.5px; font-weight:500; color:var(--ink2); background:#fff; border:1px solid var(--line); padding:7px 13px; border-radius:100px;\">Unity-ready spec<\u002Fspan>\n    <\u002Fdiv>\n\n    <!-- Principles -->\n    <div style=\"display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:14px; overflow:hidden;\">\n      <div style=\"background:#fbfbfa; padding:22px 20px;\">\n        <div style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--accent); margin-bottom:12px;\">01<\u002Fdiv>\n        <div style=\"font-size:15px; font-weight:700; margin-bottom:6px;\">Show, don't label<\u002Fdiv>\n        <div style=\"font-size:13px; line-height:1.5; color:var(--ink2);\">Every object, building and material is a thumbnail you can recognize at a glance — not a wall of names.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fbfbfa; padding:22px 20px;\">\n        <div style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--accent); margin-bottom:12px;\">02<\u002Fdiv>\n        <div style=\"font-size:15px; font-weight:700; margin-bottom:6px;\">One thing at a time<\u002Fdiv>\n        <div style=\"font-size:13px; line-height:1.5; color:var(--ink2);\">The inspector shows only the tools for what you're doing now. Advanced controls stay tucked away until asked for.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fbfbfa; padding:22px 20px;\">\n        <div style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--accent); margin-bottom:12px;\">03<\u002Fdiv>\n        <div style=\"font-size:15px; font-weight:700; margin-bottom:6px;\">Quiet by default<\u002Fdiv>\n        <div style=\"font-size:13px; line-height:1.5; color:var(--ink2);\">Neutral paper and ink let the 3D scene hold the color. A single accent marks what's active.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fbfbfa; padding:22px 20px;\">\n        <div style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--accent); margin-bottom:12px;\">04<\u002Fdiv>\n        <div style=\"font-size:15px; font-weight:700; margin-bottom:6px;\">Forgiving touch<\u002Fdiv>\n        <div style=\"font-size:13px; line-height:1.5; color:var(--ink2);\">Big targets, plain words, clear undo. A first-time resident and a daily facilitator both feel at home.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ===================== FOUNDATIONS ===================== -->\n  <div style=\"max-width:1180px; margin:0 auto; padding:40px 32px 32px;\">\n    <div style=\"display:flex; align-items:baseline; gap:14px; margin-bottom:8px;\">\n      <div style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink3);\">01<\u002Fdiv>\n      <h2 style=\"font-size:13px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink2); margin:0;\">Foundations<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"height:1px; background:var(--line); margin-bottom:28px;\"><\u002Fdiv>\n\n    <div style=\"display:grid; grid-template-columns:1.15fr 1fr; gap:18px; margin-bottom:18px;\">\n      <!-- Color -->\n      <div style=\"background:#fff; border:1px solid var(--line); border-radius:14px; padding:24px;\">\n        <div style=\"font-size:15px; font-weight:700; margin-bottom:4px;\">Color — neutral ink &amp; paper<\u002Fdiv>\n        <div style=\"font-size:13px; color:var(--ink2); line-height:1.5; margin-bottom:20px;\">Warm-neutral surfaces, near-black ink, and one calm accent. The scene supplies the color; the UI stays quiet.<\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:repeat(4,1fr); gap:10px;\">\n          <div><div style=\"height:54px; border-radius:9px; background:rgba(252,252,251,0.94); border:1px solid var(--line);\"><\u002Fdiv><div style=\"font-size:11px; font-weight:600; margin-top:7px;\">Panel<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink3);\">#FCFCFB·94%<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"height:54px; border-radius:9px; background:#1f2228;\"><\u002Fdiv><div style=\"font-size:11px; font-weight:600; margin-top:7px;\">Ink<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink3);\">#1F2228<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"height:54px; border-radius:9px; background:#6b7177;\"><\u002Fdiv><div style=\"font-size:11px; font-weight:600; margin-top:7px;\">Ink-2<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink3);\">#6B7177<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"height:54px; border-radius:9px; background:#efeee9; border:1px solid var(--line);\"><\u002Fdiv><div style=\"font-size:11px; font-weight:600; margin-top:7px;\">Tile<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink3);\">#EFEEE9<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"height:54px; border-radius:9px; background:var(--accent);\"><\u002Fdiv><div style=\"font-size:11px; font-weight:600; margin-top:7px;\">Accent<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink3);\">var<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"height:54px; border-radius:9px; background:v ill be removed from the server. This can’t be undone — Archive instead if unsure.<\u002Fdiv>\n              <div style=\"display:flex; gap:8px;\"><div style=\"flex:1; height:36px; border-radius:8px; background:#b3261e; color:#fff; display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:600;\">Delete<\u002Fdiv><div style=\"flex:1; height:36px; border-radius:8px; background:#fff; border:1px solid #f0c9c4; color:var(--ink2); display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:600;\">Cancel<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top:11px; font-size:10.5px; color:var(--ink3); line-height:1.5;\">This whole panel only appears when <span style=\"font-weight:600; color:var(--ink2);\">Admin<\u002Fspan> is on. Delete always asks first; buildings use the same flow.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ===================== UNITY MAPPING ===================== -->\n  <div style=\"max-width:1180px; margin:0 auto; padding:48px 32px 80px;\">\n    <div style=\"display:flex; align-items:baseline; gap:14px; margin-bottom:8px;\">\n      <div style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink3);\">04<\u002Fdiv>\n      <h2 style=\"font-size:13px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink2); margin:0;\">Building it in Unity<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"height:1px; background:var(--line); margin-bottom:24px;\"><\u002Fdiv>\n    <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:14px; overflow:hidden;\">\n      <div style=\"background:#fbfbfa; padding:22px 22px;\">\n        <div style=\"font-size:14px; font-weight:700; margin-bottom:10px;\">Each panel maps to one existing script<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:9px;\">\n          <div style=\"display:flex; justify-content:space-between; gap:12px; font-size:12.5px;\"><span style=\"color:var(--ink2);\">Sketch → Generate<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace; color:var(--ink); font-size:11.5px;\">ModelRequesterUI<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; gap:12px; font-size:12.5px;\"><span style=\"color:var(--ink2);\">Scene library<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace; color:var(--ink); font-size:11.5px;\">LibraryBrowser<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; gap:12px; font-size:12.5px;\"><span style=\"color:var(--ink2);\">Place / Selected<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace; color:var(--ink); font-size:11.5px;\">EditController<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; gap:12px; font-size:12.5px;\"><span style=\"color:var(--ink2);\">Building editor<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace; color:var(--ink); font-size:11.5px;\">TileBuildingEditor<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; gap:12px; font-size:12.5px;\"><span style=\"color:var(--ink2);\">Manage &amp; admin<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace; color:var(--ink); font-size:11.5px;\">LibraryClient<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fbfbfa; padding:22px 22px;\">\n        <div style=\"font-size:14px; font-weight:700; margin-bottom:10px;\">Notes for implementation<\u002Fdiv>\n        <ul style=\"margin:0; padding-left:18px; display:flex; flex-direction:column; gap:8px;\">\n          <li style=\"font-size:12.5px; color:var(--ink2); line-height:1.5;\"><b style=\"color:var(--ink);\">Thumbnails:<\u002Fb> render a runtime preview of each prefab / material to a RenderTexture once, cache it. The grid tiles are the only new asset the UI needs.<\u002Fli>\n          <li style=\"font-size:12.5px; color:var(--ink2); line-height:1.5;\"><b style=\"color:var(--ink);\">One inspector:<\u002Fb> the right panel swaps content by active mode — no new windows, just show/hide groups.<\u002Fli>\n          <li style=\"font-size:12.5px; color:var(--ink2); line-height:1.5;\"><b style=\"color:var(--ink);\">Tokens:<\u002Fb> every value here is literal (hex, px) so it ports straight into UI Toolkit USS variables.<\u002Fli>\n          <li style=\"font-size:12.5px; color:var(--ink2); line-height:1.5;\"><b style=\"color:var(--ink);\">Accent swap:<\u002Fb> change one variable to retheme (try the Tweaks panel — Cornell red, civic green, slate).<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:28px; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink3); text-align:center;\">CXR · sketch2unity — interface redesign · Cornell Tech IRL × YMPJ<\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1180},&quot;accent&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Neutral blue&quot;,&quot;Cornell red&quot;,&quot;Civic green&quot;,&quot;Slate&quot;],&quot;default&quot;:&quot;Neutral blue&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;scene&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Day terrain&quot;,&quot;Dusk lot&quot;,&quot;Neutral&quot;],&quot;default&quot;:&quot;Day terrain&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.rootRef = React.createRef();\n  }\n  _accents() {\n    return {\n      'Neutral blue': { a:'#2e63c8', ink:'#1c4ba0', tint:'#eaf1fc', line:'#bcd2f4' },\n      'Cornell red':  { a:'#b31b1b', ink:'#8c1414', tint:'#fbecec', line:'#eebfbf' },\n      'Civic green':  { a:'#2f8f5b', ink:'#226c45', tint:'#e9f5ee', line:'#bfe0cd' },\n      'Slate':        { a:'#4b5563', ink:'#374151', tint:'#eef0f3', line:'#cbd2db' }\n    };\n  }\n  _scenes() {\n    return {\n      'Day terrain': 'radial-gradient(120% 90% at 50% 0%, #cdd49a 0%, #b9c187 38%, #9fa978 72%, #8d9669 100%)',\n      'Dusk lot':    'radial-gradient(120% 90% at 50% 0%, #b8b4c2 0%, #a59fb2 40%, #8f8a9e 75%, #7d7890 100%)',\n      'Neutral':     'linear-gradient(160deg, #b9b8b2 0%, #a6a5a0 100%)'\n    };\n  }\n  _apply() {\n    const el = this.rootRef.current; if (!el) return;\n    const ac = this._accents()[this.props.accent] || this._accents()['Neutral blue'];\n    el.style.setProperty('--accent', ac.a);\n    el.style.setProperty('--accent-ink', ac.ink);\n    el.style.setProperty('--tint', ac.tint);\n    el.style.setProperty('--tint-line', ac.line);\n    const sc = this._scenes()[this.props.scene] || this._scenes()['Day terrain'];\n    el.style.setProperty('--scene', sc);\n  }\n  componentDidMount() { this._apply(); }\n  componentDidUpdate() { this._apply(); }\n  renderVals() {\n    return { rootRef: this.rootRef };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
